<svg class="em-pic em-swim" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1097 568" width="1097" height="568" data-w="1097" data-h="568" role="img" aria-label="Event model, swimlane timeline">
<style>
.em-lane-name{font:600 11px system-ui,sans-serif}.em-lane-sub{font:10px system-ui,sans-serif}.em-empty{font:13px system-ui,sans-serif}
.em-lane{opacity:.55}.em-edge{fill:none;stroke-width:1.2;opacity:.55}.em-reads{stroke-dasharray:5 4}.em-box rect{stroke-width:1.5}
