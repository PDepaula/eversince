.em-bg{fill:#fbfbf9}.em-lane{fill:#f1f2f0}.em-lane-name,.em-lane-sub,.em-kind,.em-field,.em-empty{fill:#5b6470}.em-name{fill:#1b1f24}.em-edge{stroke:#59626d}.em-head{fill:#59626d}.em-screen rect{fill:#fff4d6;stroke:#c79a1c}.em-command rect{fill:#dcebff;stroke:#3b82d6}.em-refusal{fill:#3b82d6}.em-event rect{fill:#ffe3d1;stroke:#d9732b}.em-view rect{fill:#dff4e4;stroke:#2f9e57}.em-query rect{fill:#e8e0fb;stroke:#7a5ad1}.em-processor rect{fill:#e7e9ec;stroke:#6b7480}.em-missing rect{fill:#fde0e0;stroke:#c93b3b}
@media (prefers-color-scheme:dark){.em-bg{fill:#16191d}.em-lane{fill:#1d2126}.em-lane-name,.em-lane-sub,.em-kind,.em-field,.em-empty{fill:#9aa3ad}.em-name{fill:#e6e8eb}.em-edge{stroke:#8d96a1}.em-head{fill:#8d96a1}.em-screen rect{fill:#4a3c14;stroke:#d6ad3b}.em-command rect{fill:#17324f;stroke:#5ea3ee}.em-refusal{fill:#5ea3ee}.em-event rect{fill:#4d2c17;stroke:#f08d4c}.em-view rect{fill:#173b25;stroke:#52c07c}.em-query rect{fill:#2e2650;stroke:#a08aeb}.em-processor rect{fill:#2a2e34;stroke:#8d96a1}.em-missing rect{fill:#4b1d1d;stroke:#ef6b6b}}
</style>
