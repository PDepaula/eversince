<g class="em-nodes">
<g class="em-box em-event" data-name="AgentPicked" transform="translate(716 254)"><title>event AgentPicked game:string agent:string</title><rect width="155" height="28" rx="6"/><text class="em-name" font-size="12" x="77" y="18" text-anchor="middle">AgentPicked</text></g><g class="em-box em-view" data-name="Chat" transform="translate(598 406)"><title>view Chat lines:list[ChatLine] | consumes AgentPicked,ConversationCleared,MessageSent,Said,TurnEnded</title><rect width="155" height="28" rx="6"/><text class="em-name" font-size="12" x="77" y="18" text-anchor="middle">Chat</text></g><g class="em-box em-screen" data-name="ChatPanel" transform="translate(659 70)"><title>screen ChatPanel | queries ChatSince | commands NewConversation,PickAgent,SendMessage,StopTurn</title><rect width="155" height="28" rx="6"/><text class="em-name" font-size="12" x="77" y="18" text-anchor="middle">ChatPanel</text></g><g class="em-box em-query" data-name="ChatSince" transform="translate(545 518)"><title>query ChatSince game:string since:int | reads Chat,Desk | returns ChatPage</title><rect width="155" height="28" rx="6"/><text class="em-name" font-size="12" x="77" y="18" text-anchor="middle">ChatSince</text></g><g class="em-box em-event" data-name="ConversationCleared" transform="translate(814 294)"><title>event ConversationCleared game:string</title><rect width="155" height="28" rx="6"/><text class="em-name" font-size="12" x="77" y="18" text-anchor="middle">ConversationCleared</text></g><g class="em-box em-view" data-name="Desk" transform="translate(461 366)"><title>view Desk running:list[RunningTurn] lastTurn:int stepRunning:bool stepId:int stepKind:string stepGame:string lastStepCode:int picks:list[AgentPick] | consumes AgentPicked,StepEnded,StepStarted,TurnEnded,TurnStarted</title><rect width="155" height="28" rx="6"/><text class="em-name" font-size="12" x="77" y="18" text-anchor="middle">Desk</text></g><g class="em-box em-query" data-name="DeskState" transform="translate(461 478)"><title>query DeskState | reads Desk | returns Desk</title><rect width="155" height="28" rx="6"/><text class="em-name" font-size="12" x="77" y="18" text-anchor="middle">DeskState</text></g><g class="em-box em-command" data-name="EndStep" transform="translate(688 182)"><title>command EndStep step:int code:int | reads Desk | produces StepEnded | refuses staleStep</title><rect width="155" height="28" rx="6"/><text class="em-name" font-size="12" x="77" y="18" text-anchor="middle">EndStep</text></g><g class="em-box em-command" data-name="EndTurn" transform="translate(324 182)"><title>command EndTurn game:string turn:int outcome:string | reads Desk | produces TurnEnded | refuses staleTurn</title><rect width="155" height="28" rx="6"/><text class="em-name" font-size="12" x="77" y="18" text-anchor="middle">EndTurn</text></g><g class="em-box em-event" data-name="MessageSent" transform="translate(912 254)"><title>event MessageSent game:string text:string</title><rect width="155" height="28" rx="6"/><text class="em-name" font-size="12" x="77" y="18" text-anchor="middle">MessageSent</text></g><g class="em-box em-command" data-name="NewConversation" transform="translate(856 182)"><title>command NewConversation game:string | reads Desk | produces ConversationCleared | refuses busy</title><rect width="155" height="28" rx="6"/><text class="em-name" font-size="12" x="77" y="18" text-anchor="middle">NewConversation</text></g><g class="em-box em-command" data-name="PickAgent" transform="translate(772 142)"><title>command PickAgent game:string agent:string | reads Desk | produces AgentPicked | refuses busy,whichAgent</title><rect width="155" height="28" rx="6"/><text class="em-name" font-size="12" x="77" y="18" text-anchor="middle">PickAgent</text></g><g class="em-box em-command" data-name="RecordSay" transform="translate(226 142)"><title>command RecordSay game:string turn:int text:string | reads Desk | produces Said | refuses staleTurn</title><rect width="155" height="28" rx="6"/><text class="em-name" font-size="12" x="77" y="18" text-anchor="middle">RecordSay</text></g><g class="em-box em-event" data-name="Said" transform="translate(226 294)"><title>event Said game:string turn:int text:string</title><rect width="155" height="28" rx="6"/><text class="em-name" font-size="12" x="77" y="18" text-anchor="middle">Said</text></g><g class="em-box em-command" data-name="SendMessage" transform="translate(520 182)"><title>command SendMessage game:string text:string | reads Desk | produces MessageSent,TurnStarted | refuses badMessage,busy</title><rect width="155" height="28" rx="6"/><text class="em-name" font-size="12" x="77" y="18" text-anchor="middle">SendMessage</text></g><g class="em-box em-command" data-name="StartStep" transform="translate(604 142)"><title>command StartStep game:string kind:string message:string | reads Desk | produces StepStarted | refuses busy,needsMessage</title><rect width="155" height="28" rx="6"/><text class="em-name" font-size="12" x="77" y="18" text-anchor="middle">StartStep</text></g><g class="em-box em-event" data-name="StepEnded" transform="translate(618 294)"><title>event StepEnded step:int code:int</title><rect width="155" height="28" rx="6"/><text class="em-name" font-size="12" x="77" y="18" text-anchor="middle">StepEnded</text></g><g class="em-box em-processor" data-name="StepRunner" transform="translate(575 30)"><title>processor StepRunner | consumes StepStarted | issues EndStep</title><rect width="155" height="28" rx="6"/><text class="em-name" font-size="12" x="77" y="18" text-anchor="middle">StepRunner</text></g><g class="em-box em-event" data-name="StepStarted" transform="translate(520 254)"><title>event StepStarted game:string step:int kind:string</title><rect width="155" height="28" rx="6"/><text class="em-name" font-size="12" x="77" y="18" text-anchor="middle">StepStarted</text></g><g class="em-box em-screen" data-name="StepsPanel" transform="translate(491 70)"><title>screen StepsPanel | queries DeskState | commands StartStep</title><rect width="155" height="28" rx="6"/><text class="em-name" font-size="12" x="77" y="18" text-anchor="middle">StepsPanel</text></g><g class="em-box em-event" data-name="StopRequested" transform="translate(422 294)"><title>event StopRequested game:string turn:int</title><rect width="155" height="28" rx="6"/><text class="em-name" font-size="12" x="77" y="18" text-anchor="middle">StopRequested</text></g><g class="em-box em-command" data-name="StopTurn" transform="translate(422 142)"><title>command StopTurn game:string | reads Desk | produces StopRequested | refuses noTurn</title><rect width="155" height="28" rx="6"/><text class="em-name" font-size="12" x="77" y="18" text-anchor="middle">StopTurn</text></g><g class="em-box em-event" data-name="TurnEnded" transform="translate(324 254)"><title>event TurnEnded game:string turn:int outcome:string</title><rect width="155" height="28" rx="6"/><text class="em-name" font-size="12" x="77" y="18" text-anchor="middle">TurnEnded</text></g><g class="em-box em-processor" data-name="TurnRunner" transform="translate(275 30)"><title>processor TurnRunner | consumes StopRequested,TurnStarted | issues EndTurn,RecordSay</title><rect width="155" height="28" rx="6"/><text class="em-name" font-size="12" x="77" y="18" text-anchor="middle">TurnRunner</text></g><g class="em-box em-event" data-name="TurnStarted" transform="translate(128 254)"><title>event TurnStarted game:string turn:int agent:string</title><rect width="155" height="28" rx="6"/><text class="em-name" font-size="12" x="77" y="18" text-anchor="middle">TurnStarted</text></g></g>
</svg>
